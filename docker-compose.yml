# 3 副本 KV Store（容器方式，可选）
#
# 三个节点各自一个容器，容器内统一监听 7301，对外映射 7301/7302/7303。
# 节点之间用 compose 的服务名互访（node1/node2/node3），所以容器内必须
# --bind 0.0.0.0，否则只能听到容器自己的回环地址，节点之间连不通。
#
#   docker compose up -d --build
#   python src/client.py --ports 7301,7302,7303 status
#   docker compose down
#
# 这里显式指定 project name：本项目目录名是中文，compose 无法从目录名
# 推导出项目名，不写这一行会直接报 "project name must not be empty"。
name: kvstore

# 三个服务只有 command/ports/volumes 不同，公共部分抽成锚点，
# 顺带让三份服务共用同一个镜像名（否则会生成 node1/node2/node3 三个
# 内容完全一样的 tag）。
x-kvnode: &kvnode
  build:
    context: .
  image: kvstore-node:latest
  restart: unless-stopped

services:
  node1:
    <<: *kvnode
    command:
      - "--id=1"
      - "--port=7301"
      - "--bind=0.0.0.0"
      - "--peers=1@node1:7301,2@node2:7301,3@node3:7301"
      - "--data=/data"
    ports:
      - "7301:7301"
    volumes:
      - ./data_docker/node1:/data

  node2:
    <<: *kvnode
    command:
      - "--id=2"
      - "--port=7301"
      - "--bind=0.0.0.0"
      - "--peers=1@node1:7301,2@node2:7301,3@node3:7301"
      - "--data=/data"
    ports:
      - "7302:7301"
    volumes:
      - ./data_docker/node2:/data

  node3:
    <<: *kvnode
    command:
      - "--id=3"
      - "--port=7301"
      - "--bind=0.0.0.0"
      - "--peers=1@node1:7301,2@node2:7301,3@node3:7301"
      - "--data=/data"
    ports:
      - "7303:7301"
    volumes:
      - ./data_docker/node3:/data
